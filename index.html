<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; font-src 'self'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'; worker-src 'none'; manifest-src 'none'">
<meta name="theme-color" content="#142e46">
<title>Seating Plans | Private Teacher Toolkit</title>
<link rel="stylesheet" href="styles.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="shell">
 <aside class="sidebar" aria-label="Main navigation">
  <div class="identity"><div class="brand-mark" aria-hidden="true">▦</div><div><strong>Seating Plans</strong><small>Private Teacher Toolkit</small></div></div>
  <div class="privacy-pill"><span class="status-dot"></span> Browser-only session</div>
  <nav id="nav">
   <button type="button" class="nav-item active" data-view="dashboard"><span>◫</span> Dashboard</button>
   <button type="button" class="nav-item" data-view="seating"><span>▦</span> Seating plans</button>
   <button type="button" class="nav-item" data-view="rooms"><span>▤</span> Room designer</button>
   <button type="button" class="nav-item" data-view="profiles"><span>♙</span> Pupil profiles</button>
   <button type="button" class="nav-item" data-view="records"><span>▣</span> Teacher records</button>
   <button type="button" class="nav-item" data-view="tools"><span>⚄</span> Teaching tools</button>
   <button type="button" class="nav-item" data-view="backup"><span>◇</span> Backup &amp; restore</button>
  </nav>
  <div class="sidebar-bottom"><p class="small">No accounts. No analytics. No data uploads. Save only when you export a backup.</p><button type="button" class="btn btn-ghost btn-block" id="clearSession">Clear session</button></div>
 </aside>
 <div class="main-column">
  <header class="topbar"><button type="button" class="mobile-menu" id="menuToggle" aria-label="Toggle navigation">☰</button><div id="breadcrumbs">Your workspace</div><div class="top-actions"><span id="saveIndicator" class="save-indicator">Session only</span><button type="button" class="btn btn-small" id="undoButton" title="Undo (Ctrl+Z)">↶ Undo</button><button type="button" class="btn btn-small" id="redoButton" title="Redo (Ctrl+Y)">↷ Redo</button><button type="button" class="btn btn-primary btn-small" id="quickBackup">↓ Backup</button></div></header>
  <main id="app" tabindex="-1" aria-live="polite"></main>
 </div>
</div>
<div id="modalRoot"></div><div id="toastRoot" role="status" aria-live="polite"></div>
<input hidden type="file" id="csvFile" accept=".csv,text/csv" multiple>
<input hidden type="file" id="oppFiles" accept=".docx,.zip,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/zip" multiple>
<input hidden type="file" id="backupFile" accept=".seatingplan,.json,application/json">
<input hidden type="file" id="verifyBackupFile" accept=".seatingplan,.json,application/json">
</body></html>
