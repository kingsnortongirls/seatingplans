name: Seating Plans regression tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run synthetic security and parser tests
        run: npm test

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright and browser dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify real browser wizard, backup encryption and privacy
        run: python tests/privacy_e2e.py
